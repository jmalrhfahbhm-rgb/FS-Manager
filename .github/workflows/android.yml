name: FS Manager CI

on:
  workflow_dispatch:
    inputs:
      action:
        description: "unpack = فك الضغط (مرة واحدة) | keystore = توليد المفتاح (مرة واحدة) | debug | release"
        type: choice
        default: debug
        options: [unpack, keystore, debug, release]

permissions:
  contents: write

jobs:
  unpack:
    if: inputs.action == 'unpack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project and commit
        run: |
          test -f project.zip || { echo "project.zip غير موجود في الجذر"; exit 1; }
          unzip -oq project.zip
          rm project.zip
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add FS Manager project"
          git push

  keystore:
    if: inputs.action == 'keystore'
    runs-on: ubuntu-latest
    env:
      EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Refuse if a key already exists
        run: |
          if [ -n "$EXISTING" ]; then
            echo "يوجد مفتاح محفوظ مسبقاً في Secrets. لن يتم توليد مفتاح جديد حتى لا تفقد القدرة على التحديث."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          keytool -genkeypair -keystore fsmanager-release.jks -storetype PKCS12 \
            -alias fsmanager -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=F-Studio, O=F-Studio"
          mkdir out
          cp fsmanager-release.jks out/
          {
            echo "KEYSTORE_PASSWORD=$PW"
            echo "KEY_PASSWORD=$PW"
            echo "KEY_ALIAS=fsmanager"
            echo "KEYSTORE_BASE64=$(base64 -w0 fsmanager-release.jks)"
          } > out/secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-and-secrets
          path: out
          retention-days: 3

  debug:
    if: inputs.action == 'debug'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FSManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] || { echo "ناقص: أضف الـ Secrets الأربعة أولاً"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: gradle assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FSManager-release
          path: |
            app/build/outputs/apk/release/*.apk
            
